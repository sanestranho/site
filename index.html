<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog - Tech e Urso</title>
  <style>
    /* Configurações Globais e Fundo Preto */
    body {
      background-color: #0d1117; /* Preto suave/Grafite escuro estilo GitHub Dark */
      color: #c9d1d9; /* Texto claro para leitura confortável */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Cabeçalho */
    header {
      background-color: #161b22; /* Tom de preto levemente mais claro que o fundo */
      color: #58a6ff; /* Azul tecnológico para destaque */
      text-align: center;
      max-width: 800px;
      margin: 20px auto;
      padding: 24px;
      border-radius: 6px;
      border: 1px solid #30363d;
    }

    header h1 {
      margin: 0 0 8px 0;
      font-size: 2rem;
    }

    header p {
      color: #8b949e;
      margin: 0;
    }

    /* Conteúdo Principal */
    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 16px 40px 16px;
    }

    /* Artigos/Cards do Blog */
    article {
      display: flex;
      gap: 20px;
      background-color: #161b22;
      margin-bottom: 20px;
      padding: 20px;
      border-radius: 6px;
      border: 1px solid #30363d;
      align-items: center;
    }

    img {
      width: 80px;
      height: 80px;
      border-radius: 6px;
      object-fit: cover;
